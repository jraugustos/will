<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palácio das Memórias</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main class="memory-palace">
      <header class="hero">
        <h1>Palácio das Memórias</h1>
        <p>Navegue por cenas isométricas que preservam histórias marcantes.</p>
      </header>
      <section class="slider" aria-live="polite">
        <button class="nav-button prev" aria-label="Memória anterior">&#10094;</button>
        <div class="slides">
          <article class="slide active" data-index="0">
            <div class="canvas-wrapper" id="memory-1"></div>
            <div class="caption">
              <h2>Memória 1</h2>
              <p>Uma sala de reunião acolhedora onde uma entrevista acontece com foco e empatia.</p>
            </div>
          </article>
          <article class="slide" data-index="1">
            <div class="canvas-wrapper" id="memory-2"></div>
            <div class="caption">
              <h2>Memória 2</h2>
              <p>Após a entrevista, a conversa continua na estrada rumo a novas oportunidades.</p>
            </div>
          </article>
        </div>
        <button class="nav-button next" aria-label="Próxima memória">&#10095;</button>
      </section>
      <div class="dots" role="tablist" aria-label="Seleção de memórias"></div>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
